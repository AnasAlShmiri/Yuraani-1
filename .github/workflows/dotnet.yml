name: .NET CI

on:
  push:
    branches:
      - feature/identity-auth
  pull_request:
    branches:
      - feature/identity-auth

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: "Yuraani_CI_Strong_Password!2026"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Yuraani_CI_Strong_Password!2026' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s
    env:
      YURAANI_TEST_SQLSERVER_CONNECTION: "Server=localhost,1433;Database=Yuraani_IntegrationTests;User Id=sa;Password=Yuraani_CI_Strong_Password!2026;Encrypt=True;TrustServerCertificate=True"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Yuraani.sln
      - name: Build
        run: dotnet build Yuraani.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test Yuraani.sln --configuration Release --no-build --verbosity normal
