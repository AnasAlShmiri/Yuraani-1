name: .NET CI

on:
  push:
    branches:
      - feature/identity-auth
  pull_request:
    branches:
      - feature/identity-auth

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Yuraani.sln
      - name: Build
        run: dotnet build Yuraani.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test Yuraani.sln --configuration Release --no-build --verbosity normal
